name: Android Build & Release

# Two ways in:
#  * every push runs the unit tests and (non-blocking) lint, and publishes a condensed,
#    API-readable "Unit test log" / "Lint log" check run on the commit;
#  * "Run workflow" (manual dispatch) additionally builds the APK and (optionally)
#    uploads it to a GitHub release — those inputs are required for the build job.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - debug
        default: release
      version_name:
        description: "Version name (e.g. 1.1.0)"
        type: string
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer, e.g. 2)"
        type: string
        required: true
        default: "1"
      tag:
        description: "Release tag (blank = v<version_name>)"
        type: string
        required: false
        default: ""
      release_title:
        description: "Release title (blank = v<version_name>)"
        type: string
        required: false
        default: ""
      release_notes:
        description: "Release notes (Markdown)"
        type: string
        required: false
        default: "Built with GitHub Actions."
      create_release:
        description: "Create GitHub release & upload APK"
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

# A newer push to the same branch cancels the still-running test/lint jobs; manual
# release builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  checks: write

jobs:
  # ---------------- Unit tests ----------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Setup Android environment
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          CMD="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            CMD="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ ! -x "$CMD" ]; then
            CMD="$(command -v sdkmanager || true)"
          fi
          if [ -z "$CMD" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$CMD" --licenses || true
          yes | "$CMD" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log

      # Condensed, API-readable result (compile errors, failed tests with assertions,
      # Gradle "what went wrong") as a check run on the commit + inline annotations.
      - name: Publish test log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_check.py \
            --name "Unit test log" \
            --log gradle-test.log \
            --results app/build/test-results/testDebugUnitTest \
            --outcome "${{ steps.tests.outcome }}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            gradle-test.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------- Lint (informational, never blocks a release) ----------------
  lint:
    name: Android Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          CMD="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            CMD="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ ! -x "$CMD" ]; then
            CMD="$(command -v sdkmanager || true)"
          fi
          if [ -z "$CMD" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$CMD" --licenses || true
          yes | "$CMD" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # Catches permission/typo/API regressions early. The step is allowed to fail so a
      # lint warning can never stop an APK from being built.
      - name: Lint release variant
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease --stacktrace --console=plain 2>&1 | tee gradle-lint.log

      - name: Publish lint log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_check.py \
            --name "Lint log" \
            --log gradle-lint.log \
            --lint app/build/reports/lint-results-release.xml \
            --outcome "${{ steps.lint.outcome }}" \
            --neutral

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: |
            gradle-lint.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------- Build + release ----------------
  build:
    name: Build APK (${{ inputs.build_type }})
    # Only the manual "Run workflow" path builds/releases; pushes just test + lint.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          CMD="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            CMD="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ ! -x "$CMD" ]; then
            CMD="$(command -v sdkmanager || true)"
          fi
          if [ -z "$CMD" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$CMD" --licenses || true
          yes | "$CMD" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # Release builds are always signed: either with the repo's upload key
      # (KEYSTORE_BASE64 secret, base64 of a .jks) or a throwaway key when
      # the secret is missing (so the workflow never dead-ends).
      - name: Prepare release keystore
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS_INPUT: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Using the uploaded keystore."
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - generating a throwaway self-signed keystore for this build."
            keytool -genkeypair -storetype JKS -keystore my-upload-key.jks \
              -storepass android -keypass android \
              -alias "${KEY_ALIAS_INPUT:-upload}" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SpeedMeter CI, OU=Mobile, O=SpeedMeter, L=Jaipur, ST=Rajasthan, C=IN"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace \
              -PversionName="${{ inputs.version_name }}" \
              -PversionCode="${{ inputs.version_code }}"
          else
            ./gradlew :app:assembleDebug --stacktrace \
              -PversionName="${{ inputs.version_name }}" \
              -PversionCode="${{ inputs.version_code }}"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "${{ inputs.build_type }}" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/speed-meter-v${{ inputs.version_name }}-release.apk"
            if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
              (cd app/build/outputs/mapping/release && zip -q "$GITHUB_WORKSPACE/dist/mapping.zip" mapping.txt)
            fi
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/speed-meter-v${{ inputs.version_name }}-debug.apk"
          fi
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: speed-meter-${{ inputs.build_type }}-v${{ inputs.version_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: inputs.create_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version_name) }}
          name: ${{ inputs.release_title != '' && inputs.release_title || format('v{0}', inputs.version_name) }}
          body: ${{ inputs.release_notes }}
          files: |
            dist/*.apk
          fail_on_unmatched_files: true
          # Re-running with the same tag replaces the APK asset in place.
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
